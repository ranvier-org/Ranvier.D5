name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        traced: [false, true]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          archive_url=""
          for candidate in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://mirrors.mit.edu/ubuntu; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$candidate/dists/noble/InRelease" -o /dev/null; then
              archive_url="$candidate"
              break
            fi
          done
          test -n "$archive_url"
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: $archive_url
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb xauth dbus-x11 fonts-dejavu-core libgl1-mesa-dri libglib2.0-0t64 libharfbuzz0b libharfbuzz-icu0 libicu74 libjpeg-turbo8 libepoxy0 libgcrypt20 libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 libwebp7 libwebpdemux2 libwebpmux3 libatomic1 libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2
      - name: Performance comparison contracts
        run: python -m unittest discover -s tools -p test_benchmark_comparison.py
      - name: Core contracts
        run: dotnet run --project tests/Ranvier.D5.Tests -c Release -p:RanvierTrace=${{ matrix.traced }}
      - name: Native contracts and performance
        shell: bash
        run: |
          mkdir -p artifacts
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" dotnet run --project tests/Ranvier.D5.Native.Tests -c Release -p:RanvierTrace=${{ matrix.traced }}
          "${prefix[@]}" dotnet run --project benchmarks/Ranvier.D5.Benchmarks -c Release -p:RanvierTrace=${{ matrix.traced }} -- artifacts/benchmarks.json
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-geographic-kernels artifacts/geographic-kernels.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-projections artifacts/projections.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-advanced artifacts/advanced.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-projection-families artifacts/projection-families.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-map artifacts/map.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture artifacts/gallery.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-linked artifacts/linked.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchy artifacts/hierarchy.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-tiling artifacts/tiling.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchy-charts artifacts/hierarchy-charts.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchy-explorer artifacts/hierarchy-explorer.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-planar artifacts/planar.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-quadtree artifacts/quadtree.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-spatial artifacts/spatial.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-force artifacts/force.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-network artifacts/network.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-bubbles artifacts/bubbles.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-chord artifacts/chord.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-sankey artifacts/sankey.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-flow-sankey artifacts/flow-sankey.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-flow-alluvial artifacts/flow-alluvial.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-flow-chord artifacts/flow-chord.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-density artifacts/density.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-contour artifacts/contour.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-reduction artifacts/reduction.bmp
          for recipe in heatmap hexbin contours isobands; do
            "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-density-recipe "$recipe" "artifacts/$recipe-recipe.bmp"
          done
          for recipe in violin minmax lttb; do
            "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-distribution "$recipe" "artifacts/$recipe-distribution.bmp"
          done
      - name: Paired performance regression gate
        shell: bash
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python tools/compare-benchmarks.py --traced ${{ matrix.traced }}
      - name: Geographic kernel performance
        run: dotnet run --project benchmarks/Ranvier.D5.Geo.Benchmarks -c Release -p:RanvierTrace=${{ matrix.traced }} -- artifacts/geography-benchmarks.json
      - name: Pack
        run: |
          dotnet pack src/Ranvier.D5 -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.View -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Charts -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Geo -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
      - name: Consume packed View and core
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.traced }}" == true ]]; then suffix=".Traced"; fi
          mkdir -p artifacts/consumer
          cat > artifacts/consumer/Consumer.fsproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Exe</OutputType></PropertyGroup><ItemGroup><Compile Include="Program.fs" /><PackageReference Include="Ranvier.D5.View$suffix" Version="[0.1.0-alpha.10]" /><PackageReference Include="Ranvier.D5.Charts$suffix" Version="[0.1.0-alpha.10]" /><PackageReference Include="Ranvier.D5.Geo$suffix" Version="[0.1.0-alpha.10]" /></ItemGroup></Project>
          EOF
          cat > artifacts/consumer/Program.fs <<'EOF'
          open Ranvier
          open Ranvier.D5
          let graph = new Graph()
          graph.Run(fun () ->
              let source = Api.createSignal 2.
              let mapped = Reactive.derive (fun () -> source.Value) (Scale.map (Scale.linear (0.,4.) (0.,100.)))
              if mapped.Value <> 50. then failwith "Packed memo failed"
              source.Value <- 4.
              if mapped.Value <> 100. then failwith "Packed signal failed")
          Ranvier.D5.Charts.ChartFrame.create 300. 200. "Packed chart" |> Ranvier.D5.Charts.ChartLayout.plot |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let mesh = Delaunay.build [Point.create 0. 0.; Point.create 1. 0.; Point.create 0. 1.]
          if (Delaunay.triangles mesh).Length <> 3 then failwith "Packed triangulation failed"
          if (Voronoi.clip (Bounds.create 0. 0. 1. 1.) mesh).Length <> 3 then failwith "Packed Voronoi failed"
          let forceGraph = GraphData.create [GraphNode.create "a"] [] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let force = Force.initialize (ForceConfig.create(Point.create 0. 0.)) (Seed.create 42u) forceGraph |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if (Force.step 1 force |> Force.snapshot).Nodes.Length <> 1 then failwith "Packed force failed"
          let networkSpec = Ranvier.D5.Charts.NetworkSpec.create(Ranvier.D5.Charts.ChartFrame.create 300. 200. "Packed network")
          Ranvier.D5.Charts.NetworkChart.network networkSpec forceGraph (Force.snapshot force) |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let chords = Chord.layout ChordConfig.defaultValue [[1.]] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          Ribbon.path (RibbonSpec.create 10. chords.Flows.Head) |> Path.toSvg |> ignore
          let flowGraph = FlowGraph.create ["a";"b"] [{FlowLink.Id="ab";Source="a";Target="b";Value=1.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let flow = Sankey.layout (SankeyConfig.create(Bounds.create 0. 0. 300. 200.)) flowGraph |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if flow.Links.Length <> 1 then failwith "Packed Sankey failed"
          let flowSpec = Ranvier.D5.Charts.FlowSpec.create(Ranvier.D5.Charts.ChartFrame.create 300. 200. "Packed flow")
          Ranvier.D5.Charts.FlowChart.sankey flowSpec flow |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.FlowChart.alluvial flowSpec (SankeyConfig.create(Bounds.create 0. 0. 300. 200.)) (Map.ofList ["a",0;"b",1]) flowGraph |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.FlowChart.chord (Ranvier.D5.Charts.ChordSpec.create flowSpec.Frame) ["a"] [[1.]] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let density = Density.grid (DensityConfig.create (Bounds.create 0. 0. 1. 1.) 2 2) [{WeightedPoint.Id="point";Position=Point.create 0. 0.;Weight=3.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if DensityGrid.value 0 0 density <> Some 3. then failwith "Packed density failed"
          Density.kde1d 1. [0.,1.] [0.] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let contours = Contour.compute (ContourConfig.create [1.]) density |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if contours.IsEmpty then failwith "Packed contours failed"
          let bins = Hexbin.aggregate (HexbinConfig.create (Bounds.create 0. 0. 10. 10.) 1.) [{WeightedPoint.Id="point";Position=Point.create 0. 0.;Weight=1.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if bins.Head.Members <> ["point"] then failwith "Packed hexbin failed"
          let densitySpec = Ranvier.D5.Charts.DensityChartSpec.create flowSpec.Frame (fun _ -> Paint.currentColor)
          Ranvier.D5.Charts.DensityChart.heatmap densitySpec density |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.DensityChart.hexbin densitySpec (HexbinConfig.create (Bounds.create 0. 0. 10. 10.) 1.) [{WeightedPoint.Id="point";Position=Point.create 0. 0.;Weight=1.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ContourChart.contours densitySpec (ContourConfig.create [1.]) density |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ContourChart.isobands densitySpec (ContourConfig.create [1.;2.]) density |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let samples = [for i in 0..9 -> {SeriesSample.Id=string i;X=float i;Y=Some(float(i%3))}]
          Sampling.minMax (SamplingConfig.create 4) samples |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Sampling.lttb (SamplingConfig.create 4) samples |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ReducedSeriesChart.build (Ranvier.D5.Charts.ReducedSeriesSpec.create flowSpec.Frame 4) samples |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ViolinChart.build (Ranvier.D5.Charts.ViolinSpec.create flowSpec.Frame (-1.,3.) 0.5) [{Ranvier.D5.Charts.ViolinGroup.Id="group";Observations=[{Id="sample";Value=Some 1.}]}] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.View.ForceChunk.defaultValue |> ignore
          Ranvier.D5.View.Renderer.passive |> ignore
          let geo = Ranvier.D5.Geo.GeoJson.parse """{"type":"Point","coordinates":[20,30]}""" |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          match geo with
          | Ranvier.D5.Geo.GeoDocument.Geometry geometry ->
              let bounds = Ranvier.D5.Geo.GeoMeasure.bounds Ranvier.D5.Geo.GeoStreamConfig.defaultValue geometry |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> Option.get
              if bounds.West <> 20. || bounds.North <> 30. then failwith "Packed geographic bounds failed"
          | _ -> failwith "Packed GeoJSON failed"
          let planar = Ranvier.D5.Geo.IdentityProjection.create Ranvier.D5.Geo.IdentityProjectionConfig.defaultValue |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let planarPoint = Point.create 1234. 5678.
          if Ranvier.D5.Geo.IdentityProjection.project planar planarPoint <> Some planarPoint then failwith "Packed planar identity units failed"
          let planarPaths = Ranvier.D5.Geo.PlanarPath.project Ranvier.D5.Geo.GeoPathOptions.defaultValue planar (Ranvier.D5.Geo.PlanarGeometry.LineString [Point.create 0. 0.;planarPoint]) |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if planarPaths.Length <> 1 then failwith "Packed planar path failed"
          let conic = Ranvier.D5.Geo.ProjectionConfig.defaultValue (Ranvier.D5.Geo.ProjectionKind.ConicEqualArea(29.5,45.5))
          let fitted = Ranvier.D5.Geo.ProjectionFit.size Ranvier.D5.Geo.GeoPathOptions.defaultValue 960. 500. Ranvier.D5.Geo.GeoGeometry.Sphere conic |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if not ((Ranvier.D5.Geo.Projection.config fitted).Scale > 0.) then failwith "Packed projection fit failed"
          let usa = Ranvier.D5.Geo.CompositeProjection.albersUsa 1070. (Point.create 480. 250.) |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let denver = Ranvier.D5.Geo.GeoPosition.create -104.99 39.74 |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if (Ranvier.D5.Geo.CompositeProjection.project usa denver).IsNone then failwith "Packed Albers USA failed"
          let region : Ranvier.D5.Geo.MapFeature = { Id = "co"; Name = "Colorado"; Geometry = Ranvier.D5.Geo.GeoGeometry.Polygon [[for longitude, latitude in [(-109., 37.); (-109., 41.); (-102., 41.); (-102., 37.); (-109., 37.)] -> Ranvier.D5.Geo.GeoPosition.create longitude latitude |> Result.defaultWith (fun errors -> failwithf "%A" errors)]] }
          let mapFrame = Ranvier.D5.Geo.MapFrame.create (Ranvier.D5.Charts.ChartFrame.create 400. 300. "Packed map") (Ranvier.D5.Geo.MapProjection.Composite usa)
          let choropleth : Ranvier.D5.Geo.ChoroplethSpec<string * float> = { Map = mapFrame; Key = fst; Value = Ranvier.D5.Charts.Encoding.create "Value" (snd >> Some); Domain = Ranvier.D5.Charts.Auto; Color = (fun _ -> Paint.rgb 0 0 0); Missing = Paint.rgb 1 1 1; Stroke = Paint.rgb 2 2 2; Selected = Set.empty }
          match Ranvier.D5.Geo.MapChart.choropleth choropleth [region] [("co", 1.)] with
          | Ok map when map.HitTargets.Length = 1 -> ()
          | other -> failwithf "Packed map chart failed: %A" other
          graph.Dispose()
          EOF
          cat > artifacts/consumer/NuGet.Config <<'EOF'
          <configuration><packageSources><clear /><add key="local" value="../packages" /><add key="nuget" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
          EOF
          dotnet restore artifacts/consumer/Consumer.fsproj --configfile artifacts/consumer/NuGet.Config
          dotnet run --project artifacts/consumer/Consumer.fsproj -c Release --no-restore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.traced }}
          path: |
            artifacts/*.json
            artifacts/*.bmp
            artifacts/packages/
            artifacts/comparison-*/*.json
            artifacts/comparison-*/*.log
