name: Foundation CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
        traced: [false, true]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          archive_url=""
          for candidate in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu https://mirrors.mit.edu/ubuntu; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$candidate/dists/noble/InRelease" -o /dev/null; then
              archive_url="$candidate"
              break
            fi
          done
          test -n "$archive_url"
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: $archive_url
          Suites: noble noble-updates noble-backports noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -q
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb xauth dbus-x11 fonts-dejavu-core libgl1-mesa-dri libglib2.0-0t64 libharfbuzz0b libharfbuzz-icu0 libicu74 libjpeg-turbo8 libepoxy0 libgcrypt20 libsoup-3.0-0 libtasn1-6 libxkbcommon0 libxml2 libpng16-16t64 libsqlite3-0 libwebp7 libwebpdemux2 libwebpmux3 libatomic1 libfreetype6 libfontconfig1 libwoff1 libdrm2 libegl1 libgles2 mesa-vulkan-drivers libvulkan1
      - name: Performance comparison contracts
        run: python -m unittest discover -s tools -p test_benchmark_comparison.py
      - name: Core contracts
        run: |
          dotnet run --project tests/Ranvier.D5.Tests -c Release -p:RanvierTrace=${{ matrix.traced }}
          dotnet run --project tests/Ranvier.D5.Wgpu.Tests -c Release -p:RanvierTrace=${{ matrix.traced }}
      - name: Native contracts and performance
        shell: bash
        run: |
          mkdir -p artifacts
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" dotnet run --project tests/Ranvier.D5.Native.Tests -c Release -p:RanvierTrace=${{ matrix.traced }}
          "${prefix[@]}" dotnet run --project tests/Ranvier.D5.Wgpu.Native.Tests -c Release -p:RanvierTrace=${{ matrix.traced }}
          "${prefix[@]}" dotnet run --project benchmarks/Ranvier.D5.Benchmarks -c Release -p:RanvierTrace=${{ matrix.traced }} -- artifacts/benchmarks.json
          "${prefix[@]}" dotnet run --project benchmarks/Ranvier.D5.Wgpu.Benchmarks -c Release -p:RanvierTrace=${{ matrix.traced }} -- artifacts/wgpu-benchmarks.json
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Wgpu.WaveDemo -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture artifacts/wgpu-wave.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Wgpu.LayoutsDemo -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-all artifacts
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-geographic-kernels artifacts/geographic-kernels.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-projections artifacts/projections.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-advanced artifacts/advanced.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-graph-layouts artifacts/graph-layouts.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-graph-3d artifacts/graph-3d.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-spatial-indexing artifacts/spatial-indexing.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-seriation-sets artifacts/seriation-sets.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-voronoi-treemaps artifacts/voronoi-treemaps.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-bundling-routing artifacts/bundling-routing.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-cluster-manifolds-2d artifacts/cluster-manifolds-2d.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchies-3d artifacts/hierarchies-3d.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-spherical-manifolds-3d artifacts/spherical-manifolds-3d.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-atlas-recipes artifacts/atlas-recipes.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-projection-families artifacts/projection-families.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-map artifacts/map.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture artifacts/gallery.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-linked artifacts/linked.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchy artifacts/hierarchy.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-tiling artifacts/tiling.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchy-charts artifacts/hierarchy-charts.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-hierarchy-explorer artifacts/hierarchy-explorer.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-planar artifacts/planar.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-quadtree artifacts/quadtree.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-spatial artifacts/spatial.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-force artifacts/force.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-network artifacts/network.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-bubbles artifacts/bubbles.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-chord artifacts/chord.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-sankey artifacts/sankey.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-flow-sankey artifacts/flow-sankey.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-flow-alluvial artifacts/flow-alluvial.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-flow-chord artifacts/flow-chord.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-density artifacts/density.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-contour artifacts/contour.bmp
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-reduction artifacts/reduction.bmp
          for recipe in heatmap hexbin contours isobands; do
            "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-density-recipe "$recipe" "artifacts/$recipe-recipe.bmp"
          done
          for recipe in violin minmax lttb; do
            "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Gallery -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture-distribution "$recipe" "artifacts/$recipe-distribution.bmp"
          done
      - name: Native dashboards
        shell: bash
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" dotnet run --project examples/Ranvier.D5.Dashboards -c Release -p:RanvierTrace=${{ matrix.traced }} -- --capture artifacts/dashboards
      - name: Paired performance regression gate
        shell: bash
        run: |
          prefix=()
          if [[ "$RUNNER_OS" == Linux ]]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python tools/compare-benchmarks.py --traced ${{ matrix.traced }}
      - name: Geographic kernel performance
        run: dotnet run --project benchmarks/Ranvier.D5.Geo.Benchmarks -c Release -p:RanvierTrace=${{ matrix.traced }} -- artifacts/geography-benchmarks.json
      - name: Graph and 3D layout performance
        run: dotnet run --project benchmarks/Ranvier.D5.Graph.Benchmarks -c Release -p:RanvierTrace=${{ matrix.traced }} -- artifacts/graph-benchmarks.json
      - name: Pack
        run: |
          dotnet pack src/Ranvier.D5 -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.View -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Charts -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Geo -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Graph -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Graph3D -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Wgpu -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Fable.Ranvier.D5.Wgpu -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
          dotnet pack src/Ranvier.D5.Wgpu.Sdl -c Release -p:RanvierTrace=${{ matrix.traced }} -o artifacts/packages
      - name: Consume packed View and core
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.traced }}" == true ]]; then suffix=".Traced"; fi
          mkdir -p artifacts/consumer
          cat > artifacts/consumer/Consumer.fsproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Exe</OutputType></PropertyGroup><ItemGroup><Compile Include="Program.fs" /><PackageReference Include="Ranvier.D5.View$suffix" Version="[0.4.0]" /><PackageReference Include="Ranvier.D5.Charts$suffix" Version="[0.4.0]" /><PackageReference Include="Ranvier.D5.Geo$suffix" Version="[0.4.0]" /><PackageReference Include="Ranvier.D5.Graph$suffix" Version="[0.4.0]" /><PackageReference Include="Ranvier.D5.Graph3D$suffix" Version="[0.4.0]" /><PackageReference Include="Ranvier.D5.Wgpu$suffix" Version="[0.4.0]" /><PackageReference Include="Ranvier.D5.Wgpu.Sdl$suffix" Version="[0.4.0]" /></ItemGroup></Project>
          EOF
          cat > artifacts/consumer/Program.fs <<'EOF'
          open Ranvier
          open Ranvier.D5
          let graph = new Graph()
          graph.Run(fun () ->
              let source = Api.createSignal 2.
              let mapped = Reactive.derive (fun () -> source.Value) (Scale.map (Scale.linear (0.,4.) (0.,100.)))
              if mapped.Value <> 50. then failwith "Packed memo failed"
              source.Value <- 4.
              if mapped.Value <> 100. then failwith "Packed signal failed")
          Ranvier.D5.Charts.ChartFrame.create 300. 200. "Packed chart" |> Ranvier.D5.Charts.ChartLayout.plot |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let mesh = Delaunay.build [Point.create 0. 0.; Point.create 1. 0.; Point.create 0. 1.]
          if (Delaunay.triangles mesh).Length <> 3 then failwith "Packed triangulation failed"
          if (Voronoi.clip (Bounds.create 0. 0. 1. 1.) mesh).Length <> 3 then failwith "Packed Voronoi failed"
          let forceGraph = GraphData.create [GraphNode.create "a"] [] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let force = Force.initialize (ForceConfig.create(Point.create 0. 0.)) (Seed.create 42u) forceGraph |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if (Force.step 1 force |> Force.snapshot).Nodes.Length <> 1 then failwith "Packed force failed"
          let networkSpec = Ranvier.D5.Charts.NetworkSpec.create(Ranvier.D5.Charts.ChartFrame.create 300. 200. "Packed network")
          Ranvier.D5.Charts.NetworkChart.network networkSpec forceGraph (Force.snapshot force) |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let chords = Chord.layout ChordConfig.defaultValue [[1.]] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          Ribbon.path (RibbonSpec.create 10. chords.Flows.Head) |> Path.toSvg |> ignore
          let flowGraph = FlowGraph.create ["a";"b"] [{FlowLink.Id="ab";Source="a";Target="b";Value=1.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let flow = Sankey.layout (SankeyConfig.create(Bounds.create 0. 0. 300. 200.)) flowGraph |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if flow.Links.Length <> 1 then failwith "Packed Sankey failed"
          let flowSpec = Ranvier.D5.Charts.FlowSpec.create(Ranvier.D5.Charts.ChartFrame.create 300. 200. "Packed flow")
          Ranvier.D5.Charts.FlowChart.sankey flowSpec flow |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.FlowChart.alluvial flowSpec (SankeyConfig.create(Bounds.create 0. 0. 300. 200.)) (Map.ofList ["a",0;"b",1]) flowGraph |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.FlowChart.chord (Ranvier.D5.Charts.ChordSpec.create flowSpec.Frame) ["a"] [[1.]] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let density = Density.grid (DensityConfig.create (Bounds.create 0. 0. 1. 1.) 2 2) [{WeightedPoint.Id="point";Position=Point.create 0. 0.;Weight=3.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if DensityGrid.value 0 0 density <> Some 3. then failwith "Packed density failed"
          Density.kde1d 1. [0.,1.] [0.] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let contours = Contour.compute (ContourConfig.create [1.]) density |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if contours.IsEmpty then failwith "Packed contours failed"
          let bins = Hexbin.aggregate (HexbinConfig.create (Bounds.create 0. 0. 10. 10.) 1.) [{WeightedPoint.Id="point";Position=Point.create 0. 0.;Weight=1.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if bins.Head.Members <> ["point"] then failwith "Packed hexbin failed"
          let densitySpec = Ranvier.D5.Charts.DensityChartSpec.create flowSpec.Frame (fun _ -> Paint.currentColor)
          Ranvier.D5.Charts.DensityChart.heatmap densitySpec density |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.DensityChart.hexbin densitySpec (HexbinConfig.create (Bounds.create 0. 0. 10. 10.) 1.) [{WeightedPoint.Id="point";Position=Point.create 0. 0.;Weight=1.}] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ContourChart.contours densitySpec (ContourConfig.create [1.]) density |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ContourChart.isobands densitySpec (ContourConfig.create [1.;2.]) density |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          let samples = [for i in 0..9 -> {SeriesSample.Id=string i;X=float i;Y=Some(float(i%3))}]
          Sampling.minMax (SamplingConfig.create 4) samples |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Sampling.lttb (SamplingConfig.create 4) samples |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ReducedSeriesChart.build (Ranvier.D5.Charts.ReducedSeriesSpec.create flowSpec.Frame 4) samples |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.Charts.ViolinChart.build (Ranvier.D5.Charts.ViolinSpec.create flowSpec.Frame (-1.,3.) 0.5) [{Ranvier.D5.Charts.ViolinGroup.Id="group";Observations=[{Id="sample";Value=Some 1.}]}] |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> ignore
          Ranvier.D5.View.ForceChunk.defaultValue |> ignore
          Ranvier.D5.View.Renderer.passive |> ignore
          let geo = Ranvier.D5.Geo.GeoJson.parse """{"type":"Point","coordinates":[20,30]}""" |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          match geo with
          | Ranvier.D5.Geo.GeoDocument.Geometry geometry ->
              let bounds = Ranvier.D5.Geo.GeoMeasure.bounds Ranvier.D5.Geo.GeoStreamConfig.defaultValue geometry |> Result.defaultWith (fun errors -> failwithf "%A" errors) |> Option.get
              if bounds.West <> 20. || bounds.North <> 30. then failwith "Packed geographic bounds failed"
          | _ -> failwith "Packed GeoJSON failed"
          let planar = Ranvier.D5.Geo.IdentityProjection.create Ranvier.D5.Geo.IdentityProjectionConfig.defaultValue |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let planarPoint = Point.create 1234. 5678.
          if Ranvier.D5.Geo.IdentityProjection.project planar planarPoint <> Some planarPoint then failwith "Packed planar identity units failed"
          let planarPaths = Ranvier.D5.Geo.PlanarPath.project Ranvier.D5.Geo.GeoPathOptions.defaultValue planar (Ranvier.D5.Geo.PlanarGeometry.LineString [Point.create 0. 0.;planarPoint]) |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if planarPaths.Length <> 1 then failwith "Packed planar path failed"
          let conic = Ranvier.D5.Geo.ProjectionConfig.defaultValue (Ranvier.D5.Geo.ProjectionKind.ConicEqualArea(29.5,45.5))
          let fitted = Ranvier.D5.Geo.ProjectionFit.size Ranvier.D5.Geo.GeoPathOptions.defaultValue 960. 500. Ranvier.D5.Geo.GeoGeometry.Sphere conic |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if not ((Ranvier.D5.Geo.Projection.config fitted).Scale > 0.) then failwith "Packed projection fit failed"
          let usa = Ranvier.D5.Geo.CompositeProjection.albersUsa 1070. (Point.create 480. 250.) |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let denver = Ranvier.D5.Geo.GeoPosition.create -104.99 39.74 |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if (Ranvier.D5.Geo.CompositeProjection.project usa denver).IsNone then failwith "Packed Albers USA failed"
          let region : Ranvier.D5.Geo.MapFeature = { Id = "co"; Name = "Colorado"; Geometry = Ranvier.D5.Geo.GeoGeometry.Polygon [[for longitude, latitude in [(-109., 37.); (-109., 41.); (-102., 41.); (-102., 37.); (-109., 37.)] -> Ranvier.D5.Geo.GeoPosition.create longitude latitude |> Result.defaultWith (fun errors -> failwithf "%A" errors)]] }
          let mapFrame = Ranvier.D5.Geo.MapFrame.create (Ranvier.D5.Charts.ChartFrame.create 400. 300. "Packed map") (Ranvier.D5.Geo.MapProjection.Composite usa)
          let choropleth : Ranvier.D5.Geo.ChoroplethSpec<string * float> = { Map = mapFrame; Key = fst; Value = Ranvier.D5.Charts.Encoding.create "Value" (snd >> Some); Domain = Ranvier.D5.Charts.Auto; Color = (fun _ -> Paint.rgb 0 0 0); Missing = Paint.rgb 1 1 1; Stroke = Paint.rgb 2 2 2; Selected = Set.empty }
          match Ranvier.D5.Geo.MapChart.choropleth choropleth [region] [("co", 1.)] with
          | Ok map when map.HitTargets.Length = 1 -> ()
          | other -> failwithf "Packed map chart failed: %A" other
          let diagram =
              Ranvier.D5.Graph.DiagramGraph.create
                  [ Ranvier.D5.Graph.DiagramNode.create "n1" |> Ranvier.D5.Graph.DiagramNode.inGroup "g1"
                    Ranvier.D5.Graph.DiagramNode.create "n2" |> Ranvier.D5.Graph.DiagramNode.inGroup "g1" ]
                  [ Ranvier.D5.Graph.DiagramGroup.create "g1" ]
                  [ Ranvier.D5.Graph.Association.create "e1" "n1" "n2" ]
              |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let sugiyama = Ranvier.D5.Graph.Sugiyama.layout (Ranvier.D5.Graph.SugiyamaConfig.create (Bounds.create 0. 0. 400. 300.)) diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if sugiyama.Nodes.Length <> 2 || sugiyama.Groups.Length <> 1 then failwith "Packed Sugiyama layout failed"
          Ranvier.D5.Graph.DiagramScene.render (Ranvier.D5.Graph.DiagramTheme.create 400. 300. "Packed diagram") sugiyama |> ignore
          let h3 = Ranvier.D5.Graph3D.H3.layout { Ranvier.D5.Graph3D.H3Config.defaultValue with RootId = Some "n1" } diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if h3.Nodes.Length <> 2 then failwith "Packed H3 layout failed"
          let walrus = Ranvier.D5.Graph3D.Walrus.layout { Ranvier.D5.Graph3D.WalrusConfig.defaultValue with RootId = Some "n1" } diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if walrus.Nodes.Length <> 2 then failwith "Packed Walrus layout failed"
          if Hilbert2D.decodeOrder 4 (Hilbert2D.encodeOrder 4 5 9) <> (5, 9) then failwith "Packed Hilbert2D failed"
          let rt2 = RTree2D.build snd [ "a", Bounds.create 0. 0. 10. 10.; "b", Bounds.create 50. 50. 10. 10. ]
          if (RTree2D.search (Bounds.create 2. 2. 4. 4.) rt2 |> List.map fst) <> ["a"] then failwith "Packed RTree2D failed"
          let bvh = Bvh3D.build snd [ "box", Bounds3.create -5. -5. 10. 10. 10. 10. ]
          if (Bvh3D.raycastClosest (Point3.create 0. 0. 0.) (Point3.create 0. 0. 1.) 100. bvh).IsNone then failwith "Packed Bvh3D failed"
          let upsetChart = Ranvier.D5.Charts.Chart.upset (Ranvier.D5.Charts.UpSetSpec.create (Ranvier.D5.Charts.ChartFrame.create 320. 220. "Packed UpSet")) [ "S1", [1;2;3]; "S2", [2;3;4] ] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if upsetChart.HitTargets.IsEmpty then failwith "Packed UpSet chart failed"
          if (Ranvier.D5.Geo.SphericalFibonacci.points 16 |> Result.defaultWith (fun errors -> failwithf "%A" errors)).Length <> 16 then failwith "Packed SphericalFibonacci failed"
          let leiden = Ranvier.D5.Graph.Leiden.detect Ranvier.D5.Graph.LeidenConfig.defaultValue diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if leiden.CommunityCount < 1 then failwith "Packed Leiden failed"
          let octRouted = Ranvier.D5.Graph.OctilinearRouter.route Ranvier.D5.Graph.OctilinearRouterConfig.defaultValue diagram sugiyama |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if octRouted.Associations.Length <> 1 then failwith "Packed OctilinearRouter failed"
          let fds = Ranvier.D5.Graph.FeatureDataset.ofRows [ "p0", [0.;0.]; "p1", [0.1;0.1]; "p2", [5.;5.]; "p3", [5.1;5.1] ] |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let umap2 = Ranvier.D5.Graph.Umap2D.embed { Ranvier.D5.Graph.UmapConfig.create (Bounds.create 0. 0. 100. 100.) with Neighbors = 2; Epochs = 20 } fds |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if umap2.Length <> 4 then failwith "Packed Umap2D failed"
          let tm3 = Ranvier.D5.Graph3D.Treemap3D.layout (Ranvier.D5.Graph3D.Treemap3DConfig.create (Bounds3.create 0. 0. 0. 50. 50. 50.)) (Hierarchy.node "r" 0. [ Hierarchy.node "c" 10. [] ]) |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if tm3.Length <> 2 then failwith "Packed Treemap3D failed"
          let sph3 = Ranvier.D5.Graph3D.SphericalStress3D.layout (Ranvier.D5.Graph3D.SphericalLayoutConfig.create (Point3.create 0. 0. 0.) 50.) diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if sph3.Nodes.Length <> 2 then failwith "Packed SphericalStress3D failed"
          let pdState = Ranvier.D5.Graph.PoincareDisk.buildState (Ranvier.D5.Graph.PoincareDiskConfig.create (Bounds.create 0. 0. 300. 300.)) diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if (Ranvier.D5.Graph.PoincareDisk.project pdState).Nodes.Length <> 2 then failwith "Packed PoincareDisk failed"
          let constOut = Ranvier.D5.Graph.ConstellationLayout.compute (Ranvier.D5.Graph.ConstellationConfig.create (Bounds.create 0. 0. 300. 300.)) diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if constOut.Layout.Nodes.Length <> 2 then failwith "Packed ConstellationLayout failed"
          let inlays = Ranvier.D5.Graph.ConstellationLayout.inlaySubgraphs (Ranvier.D5.Graph.ConstellationConfig.create (Bounds.create 0. 0. 300. 300.)) (Map.ofList [("n1", [("verified", 0.5)])]) (Map.ofList [("n1", diagram)]) constOut.Layout |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if inlays.Length <> 1 || inlays.Head.Nodes.Length <> 2 then failwith "Packed inlaySubgraphs failed"
          let isoOut = Ranvier.D5.Graph.IsotonicLayers.compute (Ranvier.D5.Graph.IsotonicLayersConfig.create (Bounds.create 0. 0. 300. 300.)) diagram |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          if isoOut.Layout.Nodes.Length <> 2 then failwith "Packed IsotonicLayers failed"
          let pblOut = Ranvier.D5.Graph3D.PoincareBallLift.morph 0.35 (Ranvier.D5.Graph3D.PoincareBallLiftConfig.create (Point3.create 0. 0. 0.) 120.) pdState
          if pblOut.Nodes.Length <> 2 then failwith "Packed PoincareBallLift failed"
          let scale3d = Ranvier.D5.Wgpu.Scale3D.cartesian (-2., 2.) (-2., 2.) (-1., 1.)
          let world3d = Ranvier.D5.Wgpu.Scale3D.map scale3d (Point3.create 2. 2. 1.)
          if abs (world3d.X - 1.0f) > 1e-4f then failwith "Packed Scale3D failed"
          let ramp3d = Ranvier.D5.Wgpu.ColorRamp.turbo (-1., 1.)
          if (Ranvier.D5.Wgpu.ColorRamp.tryMap ramp3d 0.25).IsNone then failwith "Packed ColorRamp failed"
          let surfGrid = Ranvier.D5.Wgpu.SurfaceGrid.fromFunction 6 6 (-2., 2.) (-2., 2.) (fun x y -> 0.5 * sin x * cos y) ValueNone |> Result.defaultWith (fun errors -> failwithf "%A" errors)
          let surfSpec : Ranvier.D5.Wgpu.SurfaceSpec = { Scale = scale3d; Color = ramp3d; Shading = Ranvier.D5.Wgpu.ShadingMode.Unlit; Opacity = 1.0f; Wireframe = ValueNone; PickId = 1u }
          let surfMesh = Ranvier.D5.Wgpu.Surface3D.build surfSpec surfGrid
          if (Ranvier.D5.Wgpu.SurfaceMesh.vertices surfMesh).Length <> 36 || (Ranvier.D5.Wgpu.SurfaceMesh.indices surfMesh).Length <> 150 then failwith "Packed Surface3D failed"
          if typeof<Ranvier.D5.Wgpu.Sdl.PlotPass3D>.Name <> "PlotPass3D" then failwith "Packed Ranvier.D5.Wgpu.Sdl failed"
          graph.Dispose()
          EOF
          cat > artifacts/consumer/NuGet.Config <<'EOF'
          <configuration><packageSources><clear /><add key="local" value="../packages" /><add key="nuget" value="https://api.nuget.org/v3/index.json" /></packageSources><packageSourceMapping><packageSource key="local"><package pattern="Ranvier.D5" /><package pattern="Ranvier.D5.*" /></packageSource><packageSource key="nuget"><package pattern="*" /></packageSource></packageSourceMapping></configuration>
          EOF
          NUGET_PACKAGES="$PWD/artifacts/consumer-cache" dotnet restore artifacts/consumer/Consumer.fsproj --configfile artifacts/consumer/NuGet.Config
          NUGET_PACKAGES="$PWD/artifacts/consumer-cache" dotnet run --project artifacts/consumer/Consumer.fsproj -c Release --no-restore
      - name: Fickl JavaScript compile
        if: matrix.os == 'ubuntu-24.04' && matrix.traced == false
        run: |
          dotnet tool restore
          dotnet fickl src/Ranvier.D5.View -o artifacts/fable/view
          dotnet fickl src/Ranvier.D5.Geo -o artifacts/fable/geo
          dotnet fickl src/Ranvier.D5.Graph -o artifacts/fable/graph
          dotnet fickl src/Ranvier.D5.Graph3D -o artifacts/fable/graph3d
          dotnet fickl src/Fable.Ranvier.D5.Wgpu -o artifacts/fable/d5-wgpu
          dotnet fickl tests/Ranvier.D5.Fickl.Tests -o artifacts/fable/tests
          printf '{"type":"module"}\n' > artifacts/fable/tests/package.json
          node artifacts/fable/tests/Program.js
          mkdir -p artifacts/fable-consumer
          cat > artifacts/fable-consumer/FableConsumer.fsproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <OutputType>Exe</OutputType>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="Program.fs" />
              <PackageReference Include="Fable.Ranvier.D5.Wgpu" Version="[0.4.0]" />
            </ItemGroup>
          </Project>
          EOF
          cat > artifacts/fable-consumer/Program.fs <<'EOF'
          open System
          open System.Numerics
          open System.Threading.Tasks
          open Ranvier
          open Ranvier.D5
          open Ranvier.D5.Wgpu
          open Ranvier.Wgpu

          // 1. Scale3D + AxisScale3D.band categorical ticks & Axis3D.build
          let scale = Scale3D.cartesian (-2.0, 2.0) (-2.0, 2.0) (-1.0, 1.0)
          let world = Scale3D.map scale (Point3.create 2.0 2.0 1.0)
          if abs (world.X - 1.0f) > 1e-4f then failwithf "Scale3D JS failed: %A" world
          let back = Scale3D.invert scale world
          if abs (back.Z - 1.0) > 1e-4 then failwithf "Scale3D.invert JS failed: %A" back

          let catX = AxisScale3D.band [ "Q1"; "Q2"; "Q3" ] 0.2 0.1
          let catY = AxisScale3D.point [ "North"; "South" ] 0.5
          if (AxisScale3D.ticks 5 catX).Length <> 3 then failwith "AxisScale3D.band ticks JS failed"
          let catScale = Scale3D.create BoxAspect.ChartDefault UpAxis.ZUp catX catY (AxisScale3D.linear (0.0, 10.0))
          let cam = Camera3D.orthographic Vector3.Zero 35.0f 25.0f 1.5f 8.0f
          let frame = Axis3D.build (Axis3D.defaultSpec catScale) 640 480 cam
          if (Axis3D.panelInstances frame).Length <> 3 || (Axis3D.lineVertices frame).Length = 0 then
              failwith "Axis3D.build panels/lines JS failed"
          let xCatTexts =
              Axis3D.labels frame
              |> Seq.filter (fun l -> l.Axis = AxisId3D.X && not l.IsTitle)
              |> Seq.map (fun l -> l.Text)
              |> Seq.toList
          if xCatTexts <> [ "Q1"; "Q2"; "Q3" ] then failwithf "Axis3D categorical labels JS failed: %A" xCatTexts

          // 2. ColorRamp.tryMap + ColorShader.packUniforms + ColorShader.disabledUniforms + wgsl + glsl
          let ramp = ColorRamp.turbo (-1.0, 1.0)
          let c = ColorRamp.tryMap ramp 0.25 |> ValueOption.get
          if c.A <= 0.0f then failwith "ColorRamp JS failed"
          let packedU = ColorShader.packUniforms -1.0f 1.0f ramp
          if packedU.Length <> 16 || packedU.Span[0].W <> 1.0f then failwith "ColorShader.packUniforms JS failed"
          let disabledU = ColorShader.disabledUniforms ()
          if disabledU.Length <> 16 || disabledU.Span[0].W <> 0.0f then failwith "ColorShader.disabledUniforms JS failed"
          let wgsl = ColorShader.wgsl ()
          if String.IsNullOrWhiteSpace wgsl || not (wgsl.Contains "d5_sample_ramp" && wgsl.Contains "vs_main" && wgsl.Contains "fs_main") then
              failwith "ColorShader.wgsl JS failed"
          let glsl = ColorShader.glsl ()
          if
              String.IsNullOrWhiteSpace glsl
              || not (
                  glsl.Contains "d5_sample_ramp"
                  && glsl.Contains "v_d5Data"
                  && glsl.Contains "#ifdef VS_MAIN"
                  && glsl.Contains "void vs_main()"
                  && glsl.Contains "#ifdef FS_MAIN"
                  && glsl.Contains "vec4 fs_main()"
                  && glsl.Contains "#ifdef FS_PICK"
                  && glsl.Contains "uvec4 fs_pick()"
              )
          then
              failwith "ColorShader.glsl JS failed"

          // 3. Surface3D.build
          let grid =
              SurfaceGrid.fromFunction 6 6 (-2.0, 2.0) (-2.0, 2.0) (fun x y -> 0.5 * sin x * cos y) ValueNone
              |> Result.defaultWith (fun e -> failwithf "%A" e)
          let spec : SurfaceSpec =
              {
                  Scale = scale
                  Color = ramp
                  Shading = ShadingMode.Lit (0.3f, 0.0f)
                  Opacity = 1.0f
                  Wireframe = ValueNone
                  PickId = 1u
              }
          let mesh = Surface3D.build spec grid
          if (SurfaceMesh.vertices mesh).Length <> 36 || (SurfaceMesh.indices mesh).Length <> 150 then
              failwith "Surface3D JS failed"

          // 4. Glyph3D.packGlyphs (Orientation3D.alignYToVector + FableCompat3D.Quaternion), Glyph3D.tryBarFromCategories + Glyph3D.packBars, Line3D.tube
          let qAlign = Orientation3D.alignYToVector (Vector3 (1.0f, 1.0f, 0.0f))
          let qManual = Quaternion.CreateFromAxisAngle (Vector3.UnitZ, 0.5f)
          let glyphs =
              Glyph3D.packGlyphs
                  scale
                  (ReadOnlySpan<GlyphDatum3D>
                      [|
                          {
                              Position = Point3.create 0.0 0.0 0.0
                              Scale = Vector3 (0.2f, 0.4f, 0.2f)
                              Rotation = qAlign * qManual
                              Color = RgbaColor.white
                              Shading = ShadingMode.Unlit
                              PickId = 7u
                              Selected = false
                          }
                      |])
          if glyphs.Length <> 1 || glyphs.Span[0].PickId <> 7u then failwith "Glyph3D.packGlyphs JS failed"

          let catBar =
              Glyph3D.tryBarFromCategories catScale "Q2" "South" 0.0 8.0 (RgbaColor (0.2f, 0.7f, 0.9f, 1.0f)) ShadingMode.Unlit 9u true
              |> ValueOption.get
          let packedBars = Glyph3D.packBars catScale (ReadOnlySpan<BarDatum3D> [| catBar |])
          if packedBars.Length <> 1 || packedBars.Span[0].PickId <> 9u then failwith "Glyph3D.tryBarFromCategories/packBars JS failed"

          let tubeMesh =
              Line3D.tube
                  scale
                  6
                  (ReadOnlySpan<struct (Point3 * float32 * RgbaColor)>
                      [|
                          struct (Point3.create -1.0 0.0 0.0, 0.1f, RgbaColor.white)
                          struct (Point3.create 1.0 0.0 0.5, 0.1f, RgbaColor.white)
                      |])
              |> Result.defaultWith (fun e -> failwithf "Line3D.tube JS failed: %A" e)
          if tubeMesh.Vertices.Length = 0 || tubeMesh.Indices.Length = 0 then failwith "Line3D.tube JS empty mesh"

          // 5. VolumeGrid.uniform + IsoSurface3D.compute
          let nx, ny, nz = 5, 5, 5
          let volData =
              [|
                  for iz = 0 to nz - 1 do
                      let z = -1.0f + 2.0f * float32 iz / float32 (nz - 1)
                      for iy = 0 to ny - 1 do
                          let y = -1.0f + 2.0f * float32 iy / float32 (ny - 1)
                          for ix = 0 to nx - 1 do
                              let x = -1.0f + 2.0f * float32 ix / float32 (nx - 1)
                              yield 1.0f - (x * x + y * y + z * z)
              |]
          let volGrid =
              VolumeGrid.uniform nx ny nz (Bounds3.create -1.0 -1.0 -1.0 2.0 2.0 2.0) (ReadOnlySpan<float32> volData) ReadOnlySpan.Empty
              |> Result.defaultWith (fun e -> failwithf "VolumeGrid.uniform JS failed: %A" e)
          let isoMesh =
              IsoSurface3D.compute scale ramp (IsoSurfaceConfig.create 0.25f) volGrid
              |> Result.defaultWith (fun e -> failwithf "IsoSurface3D.compute JS failed: %A" e)
          if isoMesh.Vertices.Length = 0 || isoMesh.Indices.Length = 0 then failwith "IsoSurface3D.compute JS empty mesh"

          // 6. PlotCamera3D.orbitBy + PlotCamera3D.withMode OrbitMode3D.Arcball + PlotCamera3D.toCamera3D
          let pCam0 = PlotCamera3D.defaultValue |> PlotCamera3D.orbitBy 30.0f -15.0f
          let wCam0 = PlotCamera3D.toCamera3D scale pCam0
          let pCamArc = PlotCamera3D.withMode OrbitMode3D.Arcball pCam0
          let wCamArc = PlotCamera3D.toCamera3D scale pCamArc
          if Vector3.Distance (wCam0.Position, wCamArc.Position) > 1e-3f then
              failwith "PlotCamera3D.withMode Arcball JS failed to preserve Position"

          // 7. Ranvier owner + KeyedCollection + Reactive3D.domainExtent + Reactive3D.asyncIsoSurface
          let graph = new Graph ()
          let isoMemo =
              graph.Run (fun () ->
                  let coll = Api.createKeyedCollection (fun struct (k: string, _: float option) -> k)
                  coll.AddOrUpdate (struct ("a", Some 2.0))
                  coll.AddOrUpdate (struct ("b", Some 10.0))
                  let ext = Reactive3D.domainExtent (fun struct (_, v) -> v) coll.Rows
                  if ext.Value <> Some (2.0, 10.0) then failwithf "Reactive3D.domainExtent JS failed: %A" ext.Value
                  coll.AddOrUpdate (struct ("c", Some -3.0))
                  if ext.Value <> Some (-3.0, 10.0) then failwithf "Reactive3D.domainExtent update JS failed: %A" ext.Value

                  let cfgSig = Api.createSignal (IsoSurfaceConfig.create 0.25f)
                  let m = Reactive3D.asyncIsoSurface (fun () -> scale) (fun () -> ramp) (fun () -> cfgSig.Value) (fun () -> volGrid)
                  ignore m.TryValue
                  m)

          let checkSettled : Task =
              task {
                  let mutable attempts = 0
                  while (match graph.Run (fun () -> isoMemo.TryValue) with Ready _ -> false | _ -> true) && attempts < 20 do
                      do! Task.Delay 5
                      graph.Pump () |> ignore
                      attempts <- attempts + 1

                  match graph.Run (fun () -> isoMemo.TryValue) with
                  | Ready (Ok settledIso) ->
                      if settledIso.Vertices.Length <> isoMesh.Vertices.Length || settledIso.Indices.Length <> isoMesh.Indices.Length then
                          failwithf "Reactive3D.asyncIsoSurface JS mismatch: %d vs %d" settledIso.Vertices.Length isoMesh.Vertices.Length
                      graph.Dispose ()
                      printfn "Packed Fable.Ranvier.D5.Wgpu JS smoke passed: %d surface verts, %d iso verts, %d cat labels" (SurfaceMesh.vertices mesh).Length settledIso.Vertices.Length xCatTexts.Length
                  | other ->
                      graph.Dispose ()
                      failwithf "Reactive3D.asyncIsoSurface JS did not settle: %A" other
              }
          ignore checkSettled
          EOF
          cat > artifacts/fable-consumer/NuGet.Config <<'EOF'
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="../packages" />
              <add key="nuget" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Ranvier.D5" />
                <package pattern="Ranvier.D5.*" />
                <package pattern="Fable.Ranvier.D5.*" />
              </packageSource>
              <packageSource key="nuget">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          NUGET_PACKAGES="$PWD/artifacts/fable-consumer-cache" dotnet restore artifacts/fable-consumer/FableConsumer.fsproj --configfile artifacts/fable-consumer/NuGet.Config
          NUGET_PACKAGES="$PWD/artifacts/fable-consumer-cache" dotnet fickl artifacts/fable-consumer/FableConsumer.fsproj -o artifacts/fable/packed-consumer --noPackageCache
          printf '{"type":"module"}\n' > artifacts/fable/packed-consumer/package.json
          node artifacts/fable/packed-consumer/Program.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.traced }}
          path: |
            artifacts/*.json
            artifacts/*.bmp
            artifacts/dashboards/*.bmp
            artifacts/packages/
            artifacts/comparison-*/*.json
            artifacts/comparison-*/*.log
